<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Gastos por Fatura</title>

<style>
body{
  font-family:Segoe UI, Arial, sans-serif;
  background:#fce7f3;
  padding:20px;
}
.container{
  max-width:1200px;
  margin:auto;
  background:#fff;
  border-radius:16px;
  box-shadow:0 10px 40px rgba(0,0,0,.15);
  padding:20px;
}
h1{color:#db2777}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:16px;
}
th,td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:left;
}
button{
  padding:6px 10px;
  border-radius:6px;
  border:none;
  cursor:pointer;
}
.add{background:#ec4899;color:#fff}
.del{background:#ef4444;color:#fff}
.edit{background:#f59e0b;color:#fff}
input,select{
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
}
.form{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
  margin-bottom:16px;
}
.checkbox-cell{cursor:pointer}
</style>
</head>

<body>
<div class="container">
<h1>📅 Controle de Gastos por Fatura</h1>

<div class="form">
<input type="date" id="inputData">
<input type="text" id="inputDesc" placeholder="Descrição">
<select id="inputCat">
<option value="">Categoria</option>
<option>Fixo</option>
<option>Outras Compras</option>
<option>Transporte</option>
<option>Ratos</option>
<option>Saldo</option>
</select>
<input type="number" id="inputVal" placeholder="Valor" step="0.01">
<button class="add" onclick="adicionarGasto()">Adicionar</button>
</div>

<table>
<thead>
<tr>
<th>Data</th>
<th>Descrição</th>
<th>Categoria</th>
<th>Valor</th>
<th>Pago?</th>
<th>Ação</th>
</tr>
</thead>
<tbody id="tabelaGastos"></tbody>
</table>
</div>

<script>
const STORAGE_KEY='gastos_fatura_v2';

function salvar(){
  const rows=[...document.querySelectorAll('#tabelaGastos tr')];
  const data=rows.map(r=>({
    data:r.children[0].textContent,
    desc:r.children[1].textContent,
    cat:r.children[2].textContent,
    val:r.children[3].textContent,
    pago:r.children[4].textContent==='☑'
  }));
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

function carregar(){
  const raw=localStorage.getItem(STORAGE_KEY);
  if(!raw) return;
  JSON.parse(raw).forEach(g=>criarLinha(g.data,g.desc,g.cat,g.val,g.pago));
}

function criarLinha(data,desc,cat,val,pago=false){
  const tr=document.createElement('tr');
  tr.innerHTML=`
    <td>${data}</td>
    <td>${desc}</td>
    <td>${cat}</td>
    <td>${val}</td>
    <td class="checkbox-cell" onclick="togglePago(this)">${pago?'☑':'☐'}</td>
    <td>
      <button class="edit" onclick="editar(this)">✎</button>
      <button class="del" onclick="deletar(this)">✕</button>
    </td>`;
  document.getElementById('tabelaGastos').appendChild(tr);
}

function adicionarGasto(){
  const d=inputData.value;
  const desc=inputDesc.value;
  const cat=inputCat.value;
  const val=parseFloat(inputVal.value);

  if(!d||!desc||!cat||!val){
    alert('Preencha todos os campos');
    return;
  }

  criarLinha(d,desc,cat,'R$ '+val.toFixed(2));
  inputData.value=inputDesc.value=inputVal.value='';
  inputCat.value='';
  salvar();
}

function deletar(btn){
  btn.closest('tr').remove();
  salvar();
}

function editar(btn){
  const tr=btn.closest('tr');
  inputData.value=tr.children[0].textContent;
  inputDesc.value=tr.children[1].textContent;
  inputCat.value=tr.children[2].textContent;
  inputVal.value=parseFloat(tr.children[3].textContent.replace('R$',''));
  tr.remove();
  salvar();
}

function togglePago(td){
  td.textContent=td.textContent==='☐'?'☑':'☐';
  salvar();
}

document.addEventListener('DOMContentLoaded',carregar);
</script>
</body>
</html>
