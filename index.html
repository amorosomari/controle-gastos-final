<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Controle de Gastos por Fatura</title>
  <style>
    /* --- base (mantive o estilo anterior e adicionei melhorias) --- */
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--accent:#ec4899;--muted:#7f1d1d}
    body{font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;background:linear-gradient(135deg,#fce7f3 0%,#fbcfe8 50%,#f9a8d4 100%);min-height:100vh;padding:30px 16px;color:#374151;line-height:1.5}
    body.dark{background:linear-gradient(135deg,#0b1020 0%,#071433 100%);color:#e6eef8}
    .container{max-width:1200px;margin:0 auto;background:white;border-radius:16px;box-shadow:0 20px 60px rgba(236,72,153,0.12);overflow:hidden}
    body.dark .container{background:#071033;box-shadow:none}
    .header{background:linear-gradient(135deg,var(--accent) 0%,#db2777 100%);color:white;padding:28px 22px;text-align:center;border-bottom:4px solid #be123c}
    .content{padding:22px}
    .tabs{display:flex;gap:10px;margin-bottom:18px;border-bottom:2px solid #f3e8f5;overflow-x:auto;padding:6px 4px}
    .tab-btn{padding:10px 14px;background:none;border:none;cursor:pointer;color:#9ca3af;font-weight:600;border-bottom:3px solid transparent;border-radius:8px}
    .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(236,72,153,0.03)}
    .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap;justify-content:space-between}
    .toolbar .left,.toolbar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .toolbar label{font-size:.85rem;color:var(--muted);font-weight:600}
    .toolbar input[type="search"],.toolbar select,.toolbar input[type="number"],.toolbar input[type="date"]{padding:8px 10px;border-radius:8px;border:1px solid #fbcfe8;background:white}
    .toolbar .period-active{border-color:var(--accent)!important;box-shadow:0 0 0 3px rgba(236,72,153,0.12)}
    .toolbar button{padding:10px 12px;border-radius:8px;border:none;cursor:pointer;font-weight:600;background:linear-gradient(135deg,var(--accent) 0%,#db2777 100%);color:white}
    .toolbar .secondary{background:#faf5ff;color:var(--muted);border:1px solid #f3e8f5}
    .tab-content{display:none;padding-top:6px}
    .tab-content.active{display:block}
    
    /* Formulário mais rápido: botão inline */
    .form-group{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px;padding:16px;background:white;border-radius:10px;border:1px solid #f9a8d4}
    .form-group:last-child button{padding:10px 16px;margin-left:auto}
    input,select{padding:10px;border-radius:8px;border:1px solid #fbcfe8;font-size:.95rem}
    input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(236,72,153,0.06)}
    label{font-weight:600;margin-bottom:6px;display:block;color:var(--muted)}
    
    /* Resumo do filtro */
    .filter-summary{margin-bottom:16px;padding:12px;background:#e7f3ff;border-radius:8px;border-left:4px solid var(--accent);font-weight:600}
    
    .table-container{background:#faf5ff;border-radius:12px;padding:18px;margin-bottom:16px;border:1px solid #f9a8d4;overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:0}
    thead tr{background:linear-gradient(90deg,var(--accent) 0%, #db2777 100%);color:white;position:sticky;top:0;z-index:10}
    th{padding:12px 10px;text-align:left;font-weight:700;font-size:.9rem;scope:"col"}
    
    /* Coluna Data sticky (fixa ao rolar horizontal) */
    th:nth-child(1), td:nth-child(1){position:sticky;left:0;background:inherit;z-index:5}
    th:nth-child(1){z-index:11}
    
    td{padding:12px 10px;border-bottom:1px solid #fbcfe8;font-weight:500;vertical-align:middle;line-height:1.4}
    tbody tr:hover{background:#fff1f7}
    
    /* Categorias (mantidas) */
    .categoria-fixo{background:#fce7f3;color:#be123c;padding:4px 10px;border-radius:8px;font-weight:600}
    .categoria-compras{background:#fcd34d;color:#78350f;padding:4px 10px;border-radius:8px;font-weight:600}
    .categoria-transporte{background:#bfdbfe;color:#1e3a8a;padding:4px 10px;border-radius:8px;font-weight:600}
    .categoria-ratos{background:#fde68a;color:#92400e;padding:4px 10px;border-radius:8px;font-weight:600}
    .categoria-saldo{background:#d1fae5;color:#065f46;padding:4px 10px;border-radius:8px;font-weight:700}
    .parcela-info{background:#e9d5ff;padding:6px 8px;border-radius:6px;font-weight:600;color:#6b21a8}
    .tipo-parcelado{background:#c084fc;color:white;padding:4px 8px;border-radius:6px;font-weight:600}
