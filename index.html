<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle de Gastos por Fatura</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#ec4899;--muted:#7f1d1d}
body{
  font-family:Segoe UI,Tahoma,Verdana,sans-serif;
  background:linear-gradient(135deg,#fce7f3,#fbcfe8,#f9a8d4);
  min-height:100vh;padding:30px 16px;color:#374151
}
body.dark{
  background:linear-gradient(135deg,#0b1020,#071433);
  color:#e6eef8
}
.container{
  max-width:1200px;margin:auto;background:white;
  border-radius:16px;box-shadow:0 20px 60px rgba(236,72,153,.12);
  overflow:hidden
}
body.dark .container{background:#071033;box-shadow:none}
.header{
  background:linear-gradient(135deg,var(--accent),#db2777);
  color:white;padding:26px;text-align:center
}
.content{padding:22px}
.tabs{display:flex;gap:10px;border-bottom:2px solid #f3e8f5;margin-bottom:16px}
.tab-btn{
  border:none;background:none;padding:10px 14px;
  font-weight:600;cursor:pointer;color:#9ca3af
}
.tab-btn.active{
  color:var(--accent);
  border-bottom:3px solid var(--accent)
}

.toolbar{
  display:flex;justify-content:space-between;
  gap:10px;flex-wrap:wrap;margin-bottom:16px
}
.toolbar .left,.toolbar .right{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center
}
.toolbar input,.toolbar select{
  padding:8px;border-radius:8px;border:1px solid #fbcfe8
}
button{
  padding:10px 12px;border-radius:8px;border:none;
  background:linear-gradient(135deg,var(--accent),#db2777);
  color:white;font-weight:600;cursor:pointer
}
.secondary{
  background:#faf5ff;color:var(--muted);
  border:1px solid #f3e8f5
}
.small{padding:6px 10px;font-size:.85rem}

.form-group{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;margin-bottom:10px
}
label{font-weight:600;color:var(--muted);margin-bottom:4px;display:block}
input,select{
  padding:10px;border-radius:8px;border:1px solid #fbcfe8
}

.table-container{
  background:#faf5ff;border-radius:12px;
  padding:16px;border:1px solid #f9a8d4
}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;text-align:left}
thead{background:linear-gradient(90deg,var(--accent),#db2777);color:white}
tbody tr:hover{background:#fff1f7;cursor:pointer}

.checkbox-cell{font-size:18px;text-align:center}

.summary-container{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;margin-bottom:16px
}
.summary-card{
  background:#fce7f3;padding:14px;border-radius:10px;
  border-left:6px solid var(--accent)
}

.flash{animation:flashBg .6s}
@keyframes flashBg{from{background:#fdf2f8}to{background:white}}

footer{
  text-align:center;padding:16px;font-size:.85rem;
  background:#faf5ff;border-top:1px solid #f9a8d4
}
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <h1>📅 Controle de Gastos</h1>
    <p>Registro simples por fatura</p>
  </div>

  <div class="content">

    <div class="tabs">
      <button class="tab-btn active">📊 Gastos</button>
    </div>

    <!-- FORM -->
    <div class="form-group">
      <div>
        <label>Data</label>
        <input type="date" id="inputData">
      </div>

      <div>
        <label>Descrição</label>
        <input type="text" id="inputDesc">
      </div>

      <div>
        <label>Categoria</label>
        <select id="inputCat">
          <option value="">Selecione</option>
          <optgroup label="Despesas">
            <option>Fixo</option>
            <option>Compras</option>
            <option>Transporte</option>
            <option>Ratos</option>
          </optgroup>
          <optgroup label="Entradas">
            <option>Saldo</option>
          </optgroup>
        </select>
      </div>

      <div>
        <label>Valor (R$)</label>
        <input type="number" id="inputVal" step="0.01">
      </div>

      <div id="advancedFields" style="display:none">
        <label>Parcela</label>
        <input type="text" id="inputParcela" placeholder="1/3">
      </div>
    </div>

    <button onclick="adicionarGasto()">+ Adicionar</button>
    <button class="secondary small" onclick="toggleAdvanced()">⚙️ Avançado</button>

    <!-- RESUMO -->
    <div class="summary-container">
      <div class="summary-card"><strong>Total Fixo</strong><div id="totalFixo">R$ 0,00</div></div>
      <div class="summary-card"><strong>Total Compras</strong><div id="totalCompras">R$ 0,00</div></div>
      <div class="summary-card"><strong>Recebido</strong><div id="totalRecebido">R$ 0,00</div></div>
      <div class="summary-card"><strong>Saldo</strong><div id="totalSaldo">R$ 0,00</div></div>
    </div>

    <!-- TABELA -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Data</th><th>Descrição</th><th>Categoria</th>
            <th>Valor</th><th>Pago</th><th>Ação</th>
          </tr>
        </thead>
        <tbody id="tabelaGastos"></tbody>
      </table>
    </div>

  </div>

  <footer>✨ Versão pessoal</footer>
</div>

<script>
const STORAGE_KEY='gastos_v2';

function toggleAdvanced(){
  const el=document.getElementById('advancedFields');
  el.style.display=el.style.display==='none'?'block':'none';
}

function adicionarGasto(){
  const data=inputData.value;
  const desc=inputDesc.value;
  const cat=inputCat.value;
  const val=parseFloat(inputVal.value||0);

  if(!data||!desc||!cat||!val){alert('Preencha os campos');return;}

  const tr=document.createElement('tr');
  tr.onclick=()=>togglePagoRow(tr);
  tr.innerHTML=`
    <td>${data}</td>
    <td>${desc}</td>
    <td>${cat}</td>
    <td>R$ ${val.toFixed(2)}</td>
    <td class="checkbox-cell">☐</td>
    <td><button onclick="event.stopPropagation();deletar(this)">✕</button></td>
  `;
  tr.classList.add('flash');
  tabelaGastos.appendChild(tr);
  setTimeout(()=>tr.classList.remove('flash'),600);

  salvar();
  atualizarTotais();
}

function togglePagoRow(tr){
  const c=tr.querySelector('.checkbox-cell');
  c.textContent=c.textContent==='☐'?'☑':'☐';
  salvar(); atualizarTotais();
}

function deletar(btn){
  btn.closest('tr').remove();
  salvar(); atualizarTotais();
}

function salvar(){
  const rows=[...tabelaGastos.children].map(r=>({
    data:r.children[0].textContent,
    desc:r.children[1].textContent,
    cat:r.children[2].textContent,
    val:r.children[3].textContent,
    pago:r.children[4].textContent==='☑'
  }));
  localStorage.setItem(STORAGE_KEY,JSON.stringify(rows));
}

function carregar(){
  const raw=localStorage.getItem(STORAGE_KEY);
  if(!raw)return;
  JSON.parse(raw).forEach(g=>{
    const tr=document.createElement('tr');
    tr.onclick=()=>togglePagoRow(tr);
    tr.innerHTML=`
      <td>${g.data}</td>
      <td>${g.desc}</td>
      <td>${g.cat}</td>
      <td>${g.val}</td>
      <td class="checkbox-cell">${g.pago?'☑':'☐'}</td>
      <td><button onclick="event.stopPropagation();deletar(this)">✕</button></td>
    `;
    tabelaGastos.appendChild(tr);
  });
  atualizarTotais();
}

function atualizarTotais(){
  let fixo=0,compras=0,receb=0;
  [...tabelaGastos.children].forEach(r=>{
    const cat=r.children[2].textContent;
    const v=parseFloat(r.children[3].textContent.replace('R$',''));
    if(cat==='Saldo')receb+=v;
    else if(cat==='Fixo')fixo+=v;
    else compras+=v;
  });
  totalFixo.textContent=`R$ ${fixo.toFixed(2)}`;
  totalCompras.textContent=`R$ ${compras.toFixed(2)}`;
  totalRecebido.textContent=`R$ ${receb.toFixed(2)}`;
  totalSaldo.textContent=`R$ ${(receb-(fixo+compras)).toFixed(2)}`;
}

document.addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.key==='Enter')adicionarGasto();
});

document.addEventListener('DOMContentLoaded',()=>{
  inputData.value=new Date().toISOString().slice(0,10);
  carregar();
});
</script>
</body>
</html>
